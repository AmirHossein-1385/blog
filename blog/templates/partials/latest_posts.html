{% load jformat %}
{% load i18n %}
<div>
    <h2>{% trans "Latest Posts" %}</h2>
    <section class="latest-posts">
        {% for post in posts  %}
            <div class="post-card">
                <a href="{{ post.get_absolute_url}}"><img src="{{post.images.first.image_file.url}}" alt="{{ post.title }}"></a>
                <div class="card-body">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.description| truncatewords:20 }}</p>
                </div>
            </div>
        {% endfor %}
    </section>
    <div class="view-all">
        <a href="{% url 'blog:post_list' %}">{% trans "View all posts" %} </a>
    </div>
</div>
