{% extends 'parent/base.html' %}
{% load blog_tags %}
{% load static %}
{% block title %}Password Change{% endblock %}
{% block content %}
    <div class="password-container">
        <h1>تغییر پسورد</h1>
        <p>پسورد قدیم و جدید را وارد کنید</p>
        <form method="post" class="password-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="ثبت" class="password-btn">
        </form>
    </div>

{% endblock %}
